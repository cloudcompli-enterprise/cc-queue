name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '5.6']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, posix
          coverage: none

      - name: Install dependencies (illuminate 10, from the lock)
        if: matrix.php == '8.2'
        run: composer install --no-interaction --prefer-dist

      - name: Install dependencies (illuminate 5.2)
        if: matrix.php == '5.6'
        run: |
          composer require --no-update 'illuminate/support:5.2.*' 'illuminate/queue:5.2.*' 'illuminate/console:5.2.*' 'illuminate/contracts:5.2.*'
          composer require --dev --no-update 'illuminate/bus:5.2.*' 'phpunit/phpunit:^5.7'
          composer update --no-interaction --prefer-dist

      - name: Run the tests
        run: vendor/bin/phpunit --log-junit junit.xml

      - name: Fail if any test was skipped
        run: |
          if grep -q '<skipped' junit.xml; then
            echo 'A test was skipped; the suite must run in full.'
            exit 1
          fi
